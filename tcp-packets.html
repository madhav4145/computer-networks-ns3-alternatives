
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Experiment 7 - TCP Protocol</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f5f7;color:#222}
.window{max-width:1200px;margin:12px auto;background:white;border:1px solid #bbb}
header{text-align:center;background:#eee;padding:12px;font-weight:bold}
.toolbar{padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafafa}
button{padding:7px 13px;background:white;border:1px solid #aaa;border-radius:4px;cursor:pointer}
button:hover{background:#e6efff}
#clock{background:#111;color:#7cff86;padding:7px;font-family:monospace}
canvas{width:100%;height:470px;display:block;border:1px solid #ddd}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.panel{border:1px solid #ddd;padding:12px;background:#fcfcfc}
h3{margin:0 0 12px;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#edf1f6;padding:10px}
.stat strong{display:block;font-size:21px;margin-top:5px}
#log{height:95px;overflow:auto;font-size:12px;line-height:1.6}
#status{font-size:13px;margin-top:12px;color:#27632a}
@media(max-width:650px){
.panels{grid-template-columns:1fr}
canvas{height:390px}
}
</style>
</head>
<body>
<div class="window">
<header>Network Animator — TCP Protocol Simulation</header>
<div class="toolbar">
<button id="start">▶ Start</button>
<button id="pause">Ⅱ Pause</button>
<button id="reset">↻ Reset</button>
<label>Speed <input id="speed" type="range" min="1" max="5" value="3"></label>
<span id="clock">0.00 s</span>
</div>
<canvas id="network"></canvas>
<div class="panels">
<div class="panel">
<h3>TCP Statistics</h3>
<div class="stats">
<div class="stat">Packets Sent<strong id="sent">0</strong></div>
<div class="stat">Packets Received<strong id="received">0</strong></div>
<div class="stat">ACKs Received<strong id="acks">0</strong></div>
</div>
<div id="status">Ready. Click Start to begin TCP transmission.</div>
</div>
<div class="panel">
<h3>TCP Event Log</h3>
<div id="log">Simulation initialized.<br>TCP sender is ready to transmit packets.</div>
</div>
</div>
</div>
<script>
const canvas=document.getElementById("network");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let running=false,last=0,time=0,nextSend=0;
let packets=[],nodes=[],serial=0;
let sent=0,received=0,acks=0,logCount=0;

function resize(){
 const r=canvas.getBoundingClientRect();
 const d=window.devicePixelRatio||1;
 canvas.width=r.width*d;canvas.height=r.height*d;
 ctx.setTransform(d,0,0,d,0,0);
 const w=r.width,y=r.height*.52;
 nodes=[
  {x:w*.12,y,label:"TCP Sender",color:"#00ef18"},
  {x:w*.37,y,label:"Router 1",color:"#fff500"},
  {x:w*.63,y,label:"Router 2",color:"#ff9800"},
  {x:w*.88,y,label:"TCP Receiver",color:"#1010f5"}
 ];
 draw();
}
function log(message){
 const line=time.toFixed(2)+" s — "+message;
 $("log").innerHTML=line+"<br>"+$("log").innerHTML;
 logCount++;
 if(logCount>30)$("log").innerHTML=$("log").innerHTML.split("<br>").slice(0,30).join("<br>");
}
function arrow(x1,y1,x2,y2,color,width=2){
 const angle=Math.atan2(y2-y1,x2-x1),head=8;
 ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x2,y2);
 ctx.lineTo(x2-head*Math.cos(angle-.5),y2-head*Math.sin(angle-.5));
 ctx.lineTo(x2-head*Math.cos(angle+.5),y2-head*Math.sin(angle+.5));
 ctx.closePath();ctx.fill();
}

/* Create forward-moving TCP data packets. */
function sendPacket(){
 packets.push({
  id:++serial,
  type:"data",
  segment:0,
  progress:0,
  speed:.8+Math.random()*.2,
  color:"#252525"
 });
 sent++;
 $("sent").textContent=sent;
}

/* Send data forward and ACKs backwards. */
function update(dt){
 const speed=+$("speed").value;
 time+=dt;
 nextSend-=dt*speed;

 if(nextSend<=0){
  sendPacket();
  nextSend=.42;
 }

 for(let i=packets.length-1;i>=0;i--){
  const p=packets[i];
  p.progress+=dt*speed*p.speed;

  if(p.progress>=1){
   p.progress=0;

   if(p.type==="data"){
    p.segment++;

    if(p.segment>=3){
     received++;
     $("received").textContent=received;

     packets.push({
      id:p.id,
      type:"ack",
      segment:2,
      progress:0,
      speed:p.speed,
      color:"#d12b35"
     });

     packets.splice(i,1);
    }
   }
   else{
    p.segment--;

    if(p.segment<0){
     acks++;
     $("acks").textContent=acks;

     if(acks%3===0){
      log("ACK "+acks+" received by TCP sender.");
     }

     packets.splice(i,1);
    }
   }
  }
 }

 $("clock").textContent=time.toFixed(2)+" s";
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 if(!w||nodes.length!==4)return;
 ctx.clearRect(0,0,w,h);
 ctx.strokeStyle="#dedfe4";ctx.lineWidth=1;
 for(let x=0;x<w;x+=w/4){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
 }
 for(let y=0;y<h;y+=h/3){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
 }
 const y=nodes[0].y;
 for(let i=0;i<3;i++){
  const a=nodes[i],b=nodes[i+1];
  ctx.strokeStyle="#9da2aa";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(a.x+25,y);ctx.lineTo(b.x-25,y);ctx.stroke();
 }

/* Data arrows move forward; ACK arrows point left. */
 packets.forEach(p=>{
  let a,b,x1,x2;

  if(p.type==="data"){
   a=nodes[p.segment];
   b=nodes[Math.min(p.segment+1,3)];
   x1=a.x+27;
   x2=b.x-27;
  }
  else{
   a=nodes[p.segment];
   b=nodes[p.segment+1];
   x1=b.x-27;
   x2=a.x+27;
  }

  const x=x1+(x2-x1)*p.progress;
  if(p.type==="ack"){
   arrow(x+11,a.y,x-11,a.y,"#d12b35",2.2);
  }else{
   arrow(x-11,a.y,x+11,a.y,p.color,2.2);
  }

  ctx.fillStyle=p.type==="ack"?"#d12b35":"#444";
  ctx.font="10px Arial";
  ctx.textAlign="center";
  ctx.fillText((p.type==="ack"?"ACK":"P")+p.id,x,a.y-9);
 });

 nodes.forEach((n,i)=>{
  ctx.beginPath();ctx.arc(n.x,n.y,24,0,Math.PI*2);
  ctx.fillStyle=n.color;ctx.fill();
  ctx.strokeStyle="#555";ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle="#222";ctx.font="12px Arial";ctx.textAlign="center";
  ctx.fillText(n.label,n.x,n.y+38);
  ctx.fillStyle="#777";ctx.font="10px Arial";
  ctx.fillText("Node "+i,n.x,n.y+52);
 });
 ctx.textAlign="left";ctx.font="12px Arial";ctx.fillStyle="#333";
 ctx.fillText("TCP DATA  →  →  →",12,20);
 ctx.textAlign="right";
 ctx.fillText("Packets in transit: "+packets.length,w-12,20);
 if(!running){
  ctx.textAlign="center";ctx.fillStyle="#666";
  ctx.fillText(time===0?"Press Start to transmit TCP packets":"Simulation paused",w/2,42);
 }
}
function loop(ts){
 if(!running)return;
 if(!last)last=ts;
 const dt=Math.min((ts-last)/1000,.05);last=ts;
 update(dt);draw();requestAnimationFrame(loop);
}
$("start").onclick=()=>{
 if(running)return;
 running=true;last=0;
 $("status").textContent="TCP packets are being transmitted.";
 log("TCP transmission started.");
 requestAnimationFrame(loop);
};
$("pause").onclick=()=>{
 running=false;last=0;draw();
 $("status").textContent="Simulation paused.";
 log("Transmission paused.");
};
$("reset").onclick=()=>{
 running=false;last=0;time=0;nextSend=0;
 packets=[];serial=0;sent=received=acks=0;logCount=0;
 $("sent").textContent=0;$("received").textContent=0;$("acks").textContent=0;
 $("clock").textContent="0.00 s";
 $("log").innerHTML="Simulation reset.";
 $("status").textContent="Ready. Click Start to begin TCP transmission.";
 draw();
};
window.addEventListener("resize",resize);
resize();
</script>
</body>
</html>
